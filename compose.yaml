services:
  morale-gg-postgres:
    image: postgres:16
    container_name: morale-gg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-morale_gg}
      POSTGRES_USER: ${POSTGRES_USER:-morale_gg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - morale_gg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-morale_gg} -d ${POSTGRES_DB:-morale_gg}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  morale_gg_postgres_data:
    name: morale_gg_postgres_data
